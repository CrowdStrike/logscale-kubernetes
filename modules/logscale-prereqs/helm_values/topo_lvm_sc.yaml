podSecurityPolicy:
  create: false

storageClasses:
  - name: topolvm-provisioner # Defines name of storage class.
    storageClass:
      # Supported filesystems are: ext4, xfs, and btrfs.
      fsType: ext4
      # reclaimPolicy
      reclaimPolicy: Delete
      # Additional annotations
      annotations: {}
      # Default storage class for dynamic volume provisioning
      # ref: https://kubernetes.io/docs/concepts/storage/dynamic-provisioning
      isDefaultClass: false
      # volumeBindingMode can be either WaitForFirstConsumer or Immediate. WaitForFirstConsumer is recommended because TopoLVM cannot schedule pods wisely if volumeBindingMode is Immediate.
      volumeBindingMode: WaitForFirstConsumer
      # enables CSI drivers to expand volumes. This feature is available for Kubernetes 1.16 and later releases.
      allowVolumeExpansion: true
      additionalParameters:
        topolvm.io/device-class: default

lvmd:
  managed: true
  deviceClasses:
    - name: default
      volume-group: nvme-vg # Change this value to your VG name.
      default: true
      spare-gb: 10
      # lvcreate-options:
      # - "--type=raid1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
              - key: k8s-app
                operator: In
                values:
                  - logscale-digest
              # - key: storageVolumeGroup
              #   operator: DoesNotExist
  tolerations:
    # - effect: NoSchedule
    #   operator: Exists
    # - key: CriticalAddonsOnly
    #   operator: Exists
    # - effect: NoExecute
    #   operator: Exists
    - key: "storageclass"
      operator: "Exists"
    #- key: "computeClass"
    #  operator: "Exists"
  initContainers:
    - name: lvm-setup
      image: debian:bookworm-slim
      securityContext:
        privileged: true
      command:
        - /bin/bash
        - -c
        - |
          DEBIAN_FRONTEND=noninteractive apt-get update && \
          DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::="--force-confold" lvm2 parted fdisk

          echo "Scanning for available disks..."
          available_disks=""
          for disk in $(ls /dev/nvme*n* 2>/dev/null || true); do
            echo "Found disk: $disk"
            if pvcreate $disk -ff -y 2>/dev/null; then
              echo "SUCCESS: Disk $disk initialized"
              available_disks="$available_disks $disk"
            fi
          done

          echo "Available disks: $available_disks"
          if [ -n "$available_disks" ]; then
            VG_NAME="nvme-vg"
            if echo "$available_disks" | grep -q "sdb"; then
              VG_NAME="ssd-vg"
            fi
            echo "Creating volume group $VG_NAME..."
            vgcreate $VG_NAME $available_disks || true
            echo "SUCCESS: Volume group $VG_NAME created"
            vgs $VG_NAME
          else
            echo "ERROR: No suitable disks found"
            exit 1
          fi
          echo "LVM setup completed"

node:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
              - key: k8s-app
                operator: In
                values:
                  - logscale-digest
              # - key: storageVolumeGroup
              #   operator: DoesNotExist
  tolerations:
    # - effect: NoSchedule
    #   operator: Exists
    # - key: CriticalAddonsOnly
    #   operator: Exists
    # - effect: NoExecute
    #   operator: Exists
    - key: "storageclass"
      operator: "Exists"
    #- key: "computeClass"
    #  operator: "Exists"

controller:
  storageCapacityTracking:
    enabled: true
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"

scheduler:
  enabled: false
webhook:
  podMutatingWebhook:
    enabled: false
cert-manager:
  enabled: true
  installCRDs: false
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  webhook:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
  cainjector:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
  startupapicheck:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"

